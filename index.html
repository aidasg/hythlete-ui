<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hythlete</title>
    <meta
      name="description"
      content="High-performance training intelligence for athletes."
    />
    <meta name="author" content="Hythlete" />
    <script>
      (() => {
        const storedTheme = localStorage.getItem("hythlete-theme");
        const preference = ["light", "dark", "system"].includes(storedTheme)
          ? storedTheme
          : "system";
        const theme = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <base href="/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
